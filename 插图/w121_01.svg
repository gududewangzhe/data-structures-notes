<svg xmlns="http://www.w3.org/2000/svg" width="890" height="290" viewBox="0 0 890 290">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .edge-dash { stroke: #829ab1; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; stroke-dasharray: 6,4; }
</style>
<g transform="translate(20, 20)">
<text class="title" x="190" y="22">课程不研究的两类非简单图</text>
<path class="edge-hi" d="M 83 118 C 55 55, 135 55, 108 117" marker-end="url(#arrow-hi)"/>
<circle class="node-bad" cx="95" cy="135" r="20"/><text x="95" y="141">v3</text>
<text class="small" x="95" y="185">自环（违反有穷性）</text>
<text class="small" x="95" y="208">可能无限绕圈回自身</text>
<path class="edge-hi" d="M 230 135 Q 287 95 345 135"/>
<line class="edge-hi" x1="230" y1="135" x2="345" y2="135"/>
<path class="edge-hi" d="M 230 135 Q 287 175 345 135"/>
<circle class="node-bad" cx="230" cy="135" r="20"/><text x="230" y="141">1</text>
<circle class="node-bad" cx="345" cy="135" r="20"/><text x="345" y="141">3</text>
<text class="small" x="287" y="190">多重边（老乡/同学/舍友）</text>
<text class="small" x="287" y="213">违反算法确定性</text>
</g>
<g transform="translate(440, 20)">
<text class="title" x="200" y="22">课堂有向图示例（始点/弧尾 与 终点/弧头）</text>
<path class="edge-ok" d="M 105 130 Q 160 88 215 130" marker-end="url(#arrow-ok)"/>
<path class="edge" d="M 215 160 Q 160 202 105 160" marker-end="url(#arrow)"/>
<line class="edge-ok" x1="252.0" y1="145.0" x2="336.0" y2="145.0" marker-end="url(#arrow-ok)"/>
<circle class="node" cx="90" cy="145" r="22"/><text x="90" y="151">v1</text>
<circle class="node-hi" cx="230" cy="145" r="22"/><text x="230" y="151">v2</text>
<circle class="node" cx="360" cy="145" r="22"/><text x="360" y="151">v3</text>
<text class="small" x="160" y="96">&lt;v1, v2&gt;</text>
<text class="small" x="160" y="206">&lt;v2, v1&gt;</text>
<text class="small" x="295" y="132">&lt;v2, v3&gt;</text>
<text class="small" x="225" y="242">弧 &lt;v2, v3&gt; 中：v2 为始点（弧尾），v3 为终点（弧头）</text>
</g>
</svg>
