<svg xmlns="http://www.w3.org/2000/svg" width="950" height="480" viewBox="0 0 950 480">
  <defs>
    <marker id="arr-b4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1e6bb8"/>
    </marker>
    <marker id="arr-o4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#d26b19"/>
    </marker>
    <marker id="arr-g4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; fill: #172b4d; }
    .title { font-size: 20px; font-weight: bold; fill: #091e42; }
    .sub-head { font-size: 16px; font-weight: bold; fill: #091e42; }
    .desc { font-size: 14px; fill: #5e6c84; }
    .node-text { font-size: 17px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #091e42; }
    .code-box { fill: #f4f5f7; stroke: #dfe1e6; stroke-width: 1.2; rx: 6; }
    .node-c { fill: #ffffff; stroke: #1e6bb8; stroke-width: 2.2; }
    .node-succ { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.5; }
    .child-link { fill: none; stroke: #1e6bb8; stroke-width: 2.2; marker-end: url(#arr-b4); }
    .thread-link { fill: none; stroke: #d26b19; stroke-width: 2; stroke-dasharray: 6,4; marker-end: url(#arr-o4); }
    .nav-path { fill: none; stroke: #2e7d32; stroke-width: 2.5; marker-end: url(#arr-g4); }
  </style>

  <text class="title" x="30" y="38">中序线索二叉树上查找结点后继的两种情形对比</text>

  <!-- 左子图：情形一 RTag == Thread -->
  <g transform="translate(40, 70)">
    <rect class="code-box" x="0" y="0" width="410" height="370"/>
    <text class="sub-head" x="20" y="32">情形 1：P->RTag == Thread（右标志为 1）</text>
    <text class="desc" x="20" y="60">右指针域本身就是后继线索，O(1) 一步直达！</text>

    <!-- 结点 P -->
    <g transform="translate(100, 160)">
      <circle class="node-c" r="24"/>
      <text class="node-text">P</text>
      <text x="-40" y="-32" font-size="14" fill="#d26b19" font-weight="bold">RTag = 1</text>
    </g>

    <!-- 结点 Post (后继) -->
    <g transform="translate(280, 160)">
      <circle class="node-succ" r="24"/>
      <text class="node-text" fill="#2e7d32">后继</text>
    </g>

    <!-- 线索箭头 -->
    <path class="thread-link" d="M124 160 L250 160"/>
    <text x="145" y="145" font-size="14" fill="#d26b19" font-weight="bold">p = p->rchild</text>

    <!-- 伪码说明 -->
    <rect x="20" y="240" width="370" height="100" fill="#ffffff" stroke="#c1c7d0" stroke-width="1" rx="4"/>
    <text x="35" y="270" font-size="14" font-family="monospace" fill="#091e42">if (p->RTag == Thread) {</text>
    <text x="55" y="295" font-size="14" font-family="monospace" fill="#2e7d32">// 直接取右线索</text>
    <text x="55" y="320" font-size="14" font-family="monospace" fill="#091e42">    p = p->rchild;</text>
    <text x="35" y="340" font-size="14" font-family="monospace" fill="#091e42">}</text>
  </g>

  <!-- 右子图：情形二 RTag == Link -->
  <g transform="translate(490, 70)">
    <rect class="code-box" x="0" y="0" width="420" height="370"/>
    <text class="sub-head" x="20" y="32">情形 2：P->RTag == Link（右标志为 0）</text>
    <text class="desc" x="20" y="60">后继是 P 的右子树中中序访问的第一个结点（最左下结点）</text>

    <!-- 结点 P -->
    <g transform="translate(80, 110)">
      <circle class="node-c" r="22"/>
      <text class="node-text">P</text>
      <text x="-40" y="-28" font-size="14" fill="#1e6bb8" font-weight="bold">RTag = 0</text>
    </g>

    <!-- 右孩子 R -->
    <g transform="translate(200, 170)">
      <circle class="node-c" r="22"/>
      <text class="node-text">R</text>
      <text x="26" y="5" font-size="13" fill="#5e6c84">右孩子</text>
    </g>

    <!-- 沿左链走 Q1 -->
    <g transform="translate(140, 240)">
      <circle class="node-c" r="22"/>
      <text class="node-text">Q1</text>
    </g>

    <!-- 最左下结点 Q_succ -->
    <g transform="translate(80, 310)">
      <circle class="node-succ" r="24"/>
      <text class="node-text" fill="#2e7d32">后继</text>
      <text x="-70" y="5" font-size="13" fill="#2e7d32" font-weight="bold">最左下</text>
    </g>

    <!-- 孩子连线 -->
    <line class="child-link" x1="98" y1="124" x2="182" y2="156"/>
    <line class="child-link" x1="184" y1="184" x2="152" y2="222"/>
    <line class="child-link" x1="126" y1="256" x2="98" y2="292"/>

    <!-- 导航路径高亮 -->
    <path class="nav-path" d="M100 100 C150 110 230 140 215 170 C205 195 160 215 155 240 C145 265 105 285 95 300"/>

    <!-- 伪码说明 -->
    <rect x="230" y="230" width="175" height="110" fill="#ffffff" stroke="#c1c7d0" stroke-width="1" rx="4"/>
    <text x="240" y="255" font-size="13" font-family="monospace" fill="#091e42">p = p->rchild;</text>
    <text x="240" y="280" font-size="13" font-family="monospace" fill="#091e42">while (p->LTag == Link)</text>
    <text x="260" y="305" font-size="13" font-family="monospace" fill="#091e42">    p = p->lchild;</text>
    <text x="240" y="330" font-size="13" font-family="monospace" fill="#2e7d32">// 到达最左下</text>
  </g>
</svg>