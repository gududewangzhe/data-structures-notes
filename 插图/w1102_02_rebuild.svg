<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330"><style>text{font:19px sans-serif;fill:#172b4d}.title{font-weight:bold;font-size:21px}.edge{stroke:#536779;stroke-width:2}.node{fill:#fff;stroke:#2476b9;stroke-width:2}.letter{text-anchor:middle;font-size:21px}</style><text class="title" x="25" y="36">后序 + 中序重建（自拟示例）</text><text x="25" y="84">后序：D E B C A</text><text x="25" y="117">中序：D B E A C</text><text x="25" y="150">根 A；左子树 D B E；右子树 C</text><text x="25" y="202">先序：A B D E C</text><text x="25" y="254">后序末项取根，中序定位并划分子树。</text><g class="edge"><path d="M650 90 L575 165 M650 90 L725 165 M575 165 L525 240 M575 165 L625 240"/></g><g class="node"><circle cx="650" cy="90" r="20"/><circle cx="575" cy="165" r="20"/><circle cx="725" cy="165" r="20"/><circle cx="525" cy="240" r="20"/><circle cx="625" cy="240" r="20"/></g><g class="letter"><text x="650" y="97">A</text><text x="575" y="172">B</text><text x="725" y="172">C</text><text x="525" y="247">D</text><text x="625" y="247">E</text></g></svg>