<text x="430" y="361" style="font-weight:bold;">3</text>
<text class="small" x="466" y="360">[2]</text>
<text class="small" x="340" y="405">WPL = 8×1 + 6×2 + 2×3 + 3×3 = 35；无度为 1 结点</text>
