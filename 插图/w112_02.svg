<circle class="node-hi" cx="340" cy="85" r="24"/>
<text x="340" y="91" style="font-weight:bold;">19</text>
<text class="small" x="376" y="90">[7]</text>
<circle class="node-ok" cx="180" cy="175" r="24"/>
<text x="180" y="181" style="font-weight:bold;">8</text>
<text class="small" x="216" y="180">[4]</text>
<circle class="node-hi" cx="470" cy="175" r="24"/>
<text x="470" y="181" style="font-weight:bold;">11</text>
<text class="small" x="506" y="180">[6]</text>
<circle class="node-hi" cx="350" cy="265" r="24"/>
<text x="350" y="271" style="font-weight:bold;">5</text>
<text class="small" x="386" y="270">[5]</text>
<circle class="node-ok" cx="570" cy="265" r="24"/>
<text x="570" y="271" style="font-weight:bold;">6</text>
<text class="small" x="606" y="270">[3]</text>
<circle class="node-ok" cx="270" cy="355" r="24"/>
<text x="270" y="361" style="font-weight:bold;">2</text>
<text class="small" x="306" y="360">[1]</text>
