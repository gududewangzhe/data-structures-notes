<svg xmlns="http://www.w3.org/2000/svg" width="930" height="325" viewBox="0 0 930 325">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1c7ed6"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .edge-blue { stroke: #1c7ed6; stroke-width: 2.2; fill: none; }
    .edge-dash { stroke: #829ab1; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; }
    .box-hi { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.8; }
    .box-warn { fill: #fff4e6; stroke: #d9480f; stroke-width: 1.8; }
</style>
<g transform="translate(20, 20)">
<text class="title" x="205" y="22">勘误：4 顶点非强连通有向图最多 (4-1)² = 9 条弧</text>
<line class="edge" x1="115.0" y1="101.0" x2="203.0" y2="101.0" marker-end="url(#arrow)"/>
<line class="edge" x1="205.0" y1="89.0" x2="117.0" y2="89.0" marker-end="url(#arrow)"/>
<line class="edge" x1="99.6" y1="115.4" x2="144.0" y2="193.8" marker-end="url(#arrow)"/>
<line class="edge" x1="155.4" y1="189.6" x2="111.0" y2="111.2" marker-end="url(#arrow)"/>
<line class="edge" x1="209.9" y1="109.5" x2="165.6" y2="187.9" marker-end="url(#arrow)"/>
<line class="edge" x1="175.1" y1="195.5" x2="219.4" y2="117.1" marker-end="url(#arrow)"/>
<line class="edge-ok" x1="334.5" y1="145.7" x2="117.5" y2="99.8" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="335.7" y1="141.8" x2="246.2" y2="104.0" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="334.9" y1="156.2" x2="182.0" y2="203.2" marker-end="url(#arrow-ok)"/>
<circle class="node" cx="95" cy="95" r="19"/><text x="95" y="100">v1</text>
<circle class="node" cx="225" cy="95" r="19"/><text x="225" y="100">v2</text>
<circle class="node" cx="160" cy="210" r="19"/><text x="160" y="215">v3</text>
<circle class="node-hi" cx="355" cy="150" r="19"/><text x="355" y="155">v4</text>
<text class="small" x="205" y="255">3 顶点有向完全图 (6 弧) ＋ v4 只出不进的 3 条单向弧 = 9 弧</text>
<text class="small" x="205" y="278">一般地：非强连通有向图最多 (n-1)(n-2)+(n-1) = (n-1)² 条弧</text>
</g>
<g transform="translate(460, 20)">
<text class="title" x="210" y="22">简单路径与回路：本课 vs 408 口径对比</text>
<rect class="box-hi" x="0" y="50" width="155" height="52"/>
<text class="subtitle" x="77.5" y="81">路径例子</text>
<rect class="box-hi" x="155" y="50" width="130" height="52"/>
<text class="subtitle" x="220.0" y="81">本课口径</text>
<rect class="box-hi" x="285" y="50" width="165" height="52"/>
<text class="subtitle" x="367.5" y="81">408 / 严蔚敏口径</text>
<rect class="box" x="0" y="102" width="155" height="52"/>
<text class="small" x="77.5" y="133">v1 → v2 → v4</text>
<rect class="box" x="155" y="102" width="130" height="52"/>
<text class="small" x="220.0" y="133">简单路径</text>
<rect class="box" x="285" y="102" width="165" height="52"/>
<text class="small" x="367.5" y="133">简单路径（全点互异）</text>
<rect class="box" x="0" y="154" width="155" height="52"/>
<text class="small" x="77.5" y="185">v1 → v2 → v4 → v1</text>
<rect class="box-warn" x="155" y="154" width="130" height="52"/>
<text class="small" x="220.0" y="185">回路（亦算简单路径）</text>
<rect class="box-warn" x="285" y="154" width="165" height="52"/>
<text class="small" x="367.5" y="185">简单回路（非简单路径）</text>
<rect class="box" x="0" y="206" width="155" height="52"/>
<text class="small" x="77.5" y="237">v1 → v2 → v3 → v2 → v1</text>
<rect class="box" x="155" y="206" width="130" height="52"/>
<text class="small" x="220.0" y="237">非简单路径</text>
<rect class="box" x="285" y="206" width="165" height="52"/>
<text class="small" x="367.5" y="237">回路（非简单回路）</text>
<text class="small" x="225" y="280">做 408 题务必记住：简单路径所有顶点（含首尾）均不重复</text>
</g>
</svg>
