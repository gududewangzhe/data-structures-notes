<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d26b19"/></marker></defs><style>text{font:17px sans-serif;fill:#172b4d}.title{font-size:21px;font-weight:bold}.label{text-anchor:middle;font-size:20px}.child{fill:none;stroke:#356c9f;stroke-width:2}.thread{fill:none;stroke:#d26b19;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arr)}.node{fill:#fff;stroke:#356c9f;stroke-width:2}</style><text class="title" x="24" y="35">中序线索示例（无头结点；自拟图）</text><text x="24" y="65">中序：E F B A G C D</text><g class="child"><path d="M400 90 L280 170 M280 170 L155 250 M280 170 L530 250 M155 250 L250 330 M530 250 L430 330 M530 250 L660 330"/></g><g class="thread"><path d="M239 315 Q150 300 155 270"/><path d="M250 310 Q310 230 290 185"/><path d="M418 95 Q490 140 440 310"/><path d="M430 310 Q455 130 398 110"/><path d="M445 317 Q505 300 523 269"/><path d="M645 315 Q590 305 543 267"/></g><g class="node"><circle cx="400" cy="90" r="19"/><circle cx="280" cy="170" r="19"/><circle cx="155" cy="250" r="19"/><circle cx="250" cy="330" r="19"/><circle cx="530" cy="250" r="19"/><circle cx="430" cy="330" r="19"/><circle cx="660" cy="330" r="19"/></g><g class="label"><text x="400" y="97">A</text><text x="280" y="177">B</text><text x="155" y="257">E</text><text x="250" y="337">F</text><text x="530" y="257">C</text><text x="430" y="337">G</text><text x="660" y="337">D</text></g><path class="child" d="M55 400 L100 400"/><text x="110" y="406">孩子指针（实线）</text><path class="thread" d="M320 400 L365 400"/><text x="375" y="406">线索指针（虚线箭头）</text><text x="24" y="438">前驱线索：F→E、G→A、D→C；后继线索：F→B、A→G、G→C。</text><text x="24" y="466">E 无前驱、D 无后继，对应空指针不画箭头；标志域用于区分孩子与线索。</text></svg>