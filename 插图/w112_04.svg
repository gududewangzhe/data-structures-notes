<svg xmlns="http://www.w3.org/2000/svg" width="900" height="398" viewBox="0 0 900 398">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; }
    .box-hi { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.8; }
    .box-warn { fill: #fff4e6; stroke: #d9480f; stroke-width: 1.8; }
</style>
<text class="title" x="450" y="28">8 枚硬币（1 枚假币未知轻重）天平三叉判定树（最多 3 次称量）</text>
<rect class="box-hi" x="340" y="48" width="220" height="40" rx="6"/>
<text x="450" y="73" style="font-weight:bold;">第 1 次：(1,2,3) vs (4,5,6)</text>
<line class="edge" x1="450" y1="88" x2="165" y2="165"/>
<text class="small" x="307.5" y="122" style="font-weight:bold;">左轻 (&lt;)</text>
<rect class="box" x="40" y="165" width="250" height="52" rx="6"/>
<text class="small" x="165" y="185">假在1..3轻或4..6重</text>
<text x="165" y="207" style="font-weight:bold;">第 2 次：(1,2,4) vs (3,5,7)</text>
<line class="edge" x1="450" y1="88" x2="450" y2="165"/>
<text class="small" x="450.0" y="122" style="font-weight:bold;">平衡 (=)</text>
<rect class="box" x="325" y="165" width="250" height="52" rx="6"/>
<text class="small" x="450" y="185">假币在 {7, 8}</text>
<text x="450" y="207" style="font-weight:bold;">第 2 次：7 vs 1(真)</text>
<line class="edge" x1="450" y1="88" x2="735" y2="165"/>
<text class="small" x="592.5" y="122" style="font-weight:bold;">右轻 (&gt;)</text>
<rect class="box" x="610" y="165" width="250" height="52" rx="6"/>
<text class="small" x="735" y="185">假在4..6轻或1..3重</text>
<text x="735" y="207" style="font-weight:bold;">对称同左侧处理</text>
<line class="edge" x1="165" y1="217" x2="55" y2="295"/>
<text class="small" x="110.0" y="256">&lt;</text>
<rect class="box-hi" x="3" y="295" width="104" height="50" rx="6"/>
<text class="small" x="55" y="314">1,2轻或5重</text>
<text class="small" x="55" y="334" style="font-weight:bold;">第3次：1 vs 2</text>
<line class="edge" x1="165" y1="217" x2="165" y2="295"/>
<text class="small" x="165.0" y="256">=</text>
<rect class="node-ok" x="113" y="295" width="104" height="50" rx="6"/>
<text class="small" x="165" y="314">6重</text>
<text class="small" x="165" y="334" style="font-weight:bold;">直接确定 6</text>
<line class="edge" x1="165" y1="217" x2="275" y2="295"/>
<text class="small" x="220.0" y="256">&gt;</text>
<rect class="box-hi" x="223" y="295" width="104" height="50" rx="6"/>
<text class="small" x="275" y="314">4重或3轻</text>
<text class="small" x="275" y="334" style="font-weight:bold;">第3次：4 vs 1(真)</text>
<line class="edge" x1="450" y1="217" x2="395" y2="295"/>
<text class="small" x="422.5" y="256">≠</text>
<rect class="node-ok" x="347" y="295" width="96" height="50" rx="6"/>
<text class="small" x="395" y="315" style="font-weight:bold;">7 必假</text>
<text class="small" x="395" y="335">第2次即定 7</text>
<line class="edge" x1="450" y1="217" x2="505" y2="295"/>
<text class="small" x="477.5" y="256">=</text>
<rect class="node-ok" x="457" y="295" width="96" height="50" rx="6"/>
<text class="small" x="505" y="315" style="font-weight:bold;">8 必假</text>
<text class="small" x="505" y="335">第2次即定 8</text>
<rect class="box" x="625" y="295" width="220" height="50" rx="6"/>
<text class="small" x="735" y="317">同理：(4,5,1) vs (6,2,7)</text>
<text class="small" x="735" y="337">第 3 次最多 1 次即可唯一锁定</text>
<line class="edge" x1="735" y1="217" x2="735" y2="295"/>
<text class="small" x="450" y="378">内结点表示称量比较（判定条件），叶子结点表示唯一确定的假币结果；最多 3 次</text>
</svg>
