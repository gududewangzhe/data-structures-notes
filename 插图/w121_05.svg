<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .edge-dash { stroke: #829ab1; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; stroke-dasharray: 6,4; }
</style>
<g transform="translate(20, 20)">
<text class="title" x="195" y="22">无向图的连通分量（极大连通子图）</text>
<rect class="box" x="35" y="55" width="190" height="175" rx="10"/>
<line class="edge-ok" x1="80" y1="100" x2="180" y2="100"/>
<line class="edge-ok" x1="180" y1="100" x2="130" y2="195"/>
<line class="edge-ok" x1="130" y1="195" x2="80" y2="100"/>
<circle class="node-ok" cx="80" cy="100" r="19"/><text class="small" x="80" y="105">v1</text>
<circle class="node-ok" cx="180" cy="100" r="19"/><text class="small" x="180" y="105">v2</text>
<circle class="node-ok" cx="130" cy="195" r="19"/><text class="small" x="130" y="200">v3</text>
<rect class="box" x="235" y="55" width="150" height="175" rx="10"/>
<line class="edge" x1="310" y1="100" x2="270" y2="195"/>
<line class="edge" x1="310" y1="100" x2="350" y2="195"/>
<circle class="node" cx="310" cy="100" r="19"/><text class="small" x="310" y="105">v4</text>
<circle class="node" cx="270" cy="195" r="19"/><text class="small" x="270" y="200">v5</text>
<circle class="node" cx="350" cy="195" r="19"/><text class="small" x="350" y="200">v6</text>
<text class="small" x="195" y="258">全图非连通，有 2 个连通分量：{v1,v2,v3} 与 {v4,v5,v6}</text>
</g>
<g transform="translate(450, 20)">
<text class="title" x="190" y="22">有向图的强连通分量</text>
<rect class="box" x="55" y="55" width="200" height="175" rx="10"/>
<rect class="box" x="275" y="95" width="80" height="100" rx="10"/>
<line class="edge-ok" x1="125.0" y1="100.0" x2="182.0" y2="100.0" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="195.7" y1="117.7" x2="165.7" y2="174.6" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="145.7" y1="177.3" x2="115.7" y2="120.4" marker-end="url(#arrow-ok)"/>
<line class="edge-dash" x1="124.6" y1="104.2" x2="292.5" y2="140.2" marker-end="url(#arrow)"/>
<circle class="node-ok" cx="105" cy="100" r="19"/><text class="small" x="105" y="105">v1</text>
<circle class="node-ok" cx="205" cy="100" r="19"/><text class="small" x="205" y="105">v3</text>
<circle class="node-ok" cx="155" cy="195" r="19"/><text class="small" x="155" y="200">v4</text>
<circle class="node-hi" cx="315" cy="145" r="19"/><text class="small" x="315" y="150">v2</text>
<text class="small" x="190" y="258">2 个强连通分量：{v1,v3,v4}（双向可达）与 {v2}</text>
</g>
</svg>
