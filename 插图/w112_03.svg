<text class="small" x="220" y="218">0</text>
<text class="small" x="320" y="218">1</text>
<circle class="node" cx="180" cy="90" r="22"/><text x="180" y="96">根</text>
<circle class="node-ok" cx="90" cy="175" r="22"/><text x="90" y="181">E</text>
