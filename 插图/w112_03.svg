<circle class="node-ok" cx="90" cy="175" r="22"/><text x="90" y="181">E</text>
<circle class="node" cx="270" cy="175" r="18"/>
<circle class="node-ok" cx="200" cy="260" r="22"/><text x="200" y="266">A</text>
<circle class="node" cx="340" cy="260" r="18"/>
<circle class="node-ok" cx="285" cy="340" r="22"/><text x="285" y="346">S</text>
<circle class="node-ok" cx="395" cy="340" r="22"/><text x="395" y="346">T</text>
