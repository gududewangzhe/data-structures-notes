<circle class="node" cx="200" cy="265" r="22"/><text x="200" y="271">S</text>
<circle class="node" cx="340" cy="265" r="22"/><text x="340" y="271">T</text>
<text class="small" x="270" y="318" style="fill:#c92a2a;font-weight:bold;">A(1) 是 S(10) 和 T(11) 的前缀！</text>
</g>
<g transform="translate(430, 20)">
<text class="title" x="190" y="24">前缀无关编码：字符全放叶子结点</text>
<text class="small" x="190" y="48">左分支 0，右分支 1（例：E:0, A:10, S:110, T:111）</text>
