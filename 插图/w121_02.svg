<line class="edge-ok" x1="263.0" y1="107.0" x2="263.0" y2="191.0" marker-end="url(#arrow-ok)"/>
<line class="edge" x1="277.0" y1="193.0" x2="277.0" y2="109.0" marker-end="url(#arrow)"/>
<line class="edge-ok" x1="248.5" y1="93.4" x2="124.2" y2="194.4" marker-end="url(#arrow-ok)"/>
<line class="edge" x1="131.5" y1="206.6" x2="255.8" y2="105.6" marker-end="url(#arrow)"/>
<line class="edge-ok" x1="248.0" y1="208.0" x2="134.0" y2="208.0" marker-end="url(#arrow-ok)"/>
<line class="edge" x1="132.0" y1="222.0" x2="246.0" y2="222.0" marker-end="url(#arrow)"/>
<circle class="node-hi" cx="110" cy="85" r="20"/><text x="110" y="91">v1</text>
<circle class="node-hi" cx="270" cy="85" r="20"/><text x="270" y="91">v2</text>
<circle class="node-hi" cx="270" cy="215" r="20"/><text x="270" y="221">v3</text>
<circle class="node-hi" cx="110" cy="215" r="20"/><text x="110" y="221">v4</text>
<text class="small" x="190" y="265">任意两点间存在双向两条弧：&lt;vi,vj&gt; ≠ &lt;vj,vi&gt;</text>
</g>
</svg>
