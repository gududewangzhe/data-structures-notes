<svg xmlns="http://www.w3.org/2000/svg" width="860" height="315" viewBox="0 0 860 315">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .edge-dash { stroke: #829ab1; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; stroke-dasharray: 6,4; }
</style>
<g transform="translate(20, 20)">
<text class="title" x="180" y="22">无向图：各顶点度之和 = 2e</text>
<line class="edge" x1="100" y1="95" x2="260" y2="95"/>
<line class="edge" x1="260" y1="95" x2="260" y2="215"/>
<line class="edge" x1="260" y1="215" x2="100" y2="215"/>
<line class="edge" x1="100" y1="215" x2="100" y2="95"/>
<line class="edge" x1="100" y1="95" x2="260" y2="215"/>
<circle class="node" cx="100" cy="95" r="20"/><text x="100" y="101">v1</text>
<text class="small" x="45" y="100" style="font-weight:bold;">TD=3</text>
<circle class="node" cx="260" cy="95" r="20"/><text x="260" y="101">v2</text>
<text class="small" x="315" y="100" style="font-weight:bold;">TD=2</text>
<circle class="node" cx="260" cy="215" r="20"/><text x="260" y="221">v3</text>
<text class="small" x="315" y="220" style="font-weight:bold;">TD=3</text>
<circle class="node" cx="100" cy="215" r="20"/><text x="100" y="221">v4</text>
<text class="small" x="45" y="220" style="font-weight:bold;">TD=2</text>
<text class="small" x="180" y="268">e = 5，ΣTD = 3+2+3+2 = 10 = 2e</text>
</g>
<g transform="translate(430, 20)">
<text class="title" x="195" y="22">有向图：ΣID = ΣOD = e</text>
<line class="edge-ok" x1="136.0" y1="95.0" x2="251.0" y2="95.0" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="131.8" y1="107.6" x2="255.8" y2="200.6" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="254.0" y1="215.0" x2="139.0" y2="215.0" marker-end="url(#arrow-ok)"/>
<line class="edge-ok" x1="115.0" y1="194.0" x2="115.0" y2="119.0" marker-end="url(#arrow-ok)"/>
<circle class="node" cx="115" cy="95" r="20"/><text x="115" y="101">v1</text>
<text class="small" x="53" y="100">ID=1,OD=2</text>
<circle class="node-hi" cx="275" cy="95" r="20"/><text x="275" y="101">v2</text>
<text class="small" x="340" y="100">ID=1,OD=0</text>
<circle class="node" cx="275" cy="215" r="20"/><text x="275" y="221">v3</text>
<text class="small" x="340" y="220">ID=1,OD=1</text>
<circle class="node" cx="115" cy="215" r="20"/><text x="115" y="221">v4</text>
<text class="small" x="53" y="220">ID=1,OD=1</text>
<text class="small" x="195" y="268">e = 4，ΣID = ΣOD = 4；v2 出度为 0（终端顶点）</text>
</g>
</svg>
