<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#4a607a"/></marker><marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d9534f"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b8a3e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1c7ed6"/></marker></defs>
<style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172b4d; font-size: 15px; text-anchor: middle; }
    .title { font-size: 17px; font-weight: bold; fill: #0f2544; }
    .subtitle { font-size: 15px; font-weight: bold; fill: #1d4e89; }
    .small { font-size: 14px; fill: #334e68; }
    .edge { stroke: #4a607a; stroke-width: 2; fill: none; }
    .edge-hi { stroke: #d9534f; stroke-width: 2.5; fill: none; }
    .edge-ok { stroke: #2b8a3e; stroke-width: 2.5; fill: none; }
    .edge-blue { stroke: #1c7ed6; stroke-width: 2.2; fill: none; }
    .edge-dash { stroke: #829ab1; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .node { fill: #ffffff; stroke: #2672b8; stroke-width: 2; }
    .node-hi { fill: #fff3cd; stroke: #d97706; stroke-width: 2.2; }
    .node-bad { fill: #fde8e8; stroke: #c92a2a; stroke-width: 2.2; }
    .node-ok { fill: #e6fcf5; stroke: #0ca678; stroke-width: 2.2; }
    .box { fill: #f8fafc; stroke: #334e68; stroke-width: 1.5; }
    .box-hi { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.8; }
    .box-warn { fill: #fff4e6; stroke: #d9480f; stroke-width: 1.8; }
</style>
<g transform="translate(20, 20)">
<text class="title" x="100" y="22">有向图（3 顶点 3 弧）</text>
<path class="edge-blue" d="M 88 92 Q 48 130 56 177" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M 66 184 Q 102 142 96 99" marker-end="url(#arrow)"/>
<line class="edge-blue" x1="69.0" y1="195.0" x2="134.0" y2="195.0" marker-end="url(#arrow-blue)"/>
<circle class="node-hi" cx="100" cy="80" r="18"/><text x="100" y="85">1</text>
<circle class="node-hi" cx="50" cy="195" r="18"/><text x="50" y="200">2</text>
<circle class="node-hi" cx="155" cy="195" r="18"/><text x="155" y="200">3</text>
<text class="small" x="100" y="245">弧：&lt;1,2&gt; &lt;2,1&gt; &lt;2,3&gt;</text>
</g>
<g transform="translate(250, 20)">
<text class="title" x="145" y="22">邻接表（存出边，链长＝OD）</text>
<rect class="box-hi" x="10" y="65" width="36" height="30"/><text class="small" x="28" y="85" style="font-weight:bold;">1</text>
<rect class="box" x="46" y="65" width="32" height="30"/>
<line class="edge" x1="62" y1="80" x2="105" y2="80" marker-end="url(#arrow)"/>
<rect class="box-warn" x="108" y="65" width="32" height="30"/><text class="small" x="124" y="85">2</text>
<rect class="box" x="140" y="65" width="26" height="30"/>
<text class="small" x="153" y="85">^</text>
<rect class="box-hi" x="10" y="120" width="36" height="30"/><text class="small" x="28" y="140" style="font-weight:bold;">2</text>
<rect class="box" x="46" y="120" width="32" height="30"/>
<line class="edge" x1="62" y1="135" x2="105" y2="135" marker-end="url(#arrow)"/>
<rect class="box-warn" x="108" y="120" width="32" height="30"/><text class="small" x="124" y="140">1</text>
<rect class="box" x="140" y="120" width="26" height="30"/>
<line class="edge" x1="153" y1="135" x2="190" y2="135" marker-end="url(#arrow)"/>
<rect class="box-warn" x="193" y="120" width="32" height="30"/><text class="small" x="209" y="140">3</text>
<rect class="box" x="225" y="120" width="26" height="30"/>
<text class="small" x="238" y="140">^</text>
<rect class="box-hi" x="10" y="175" width="36" height="30"/><text class="small" x="28" y="195" style="font-weight:bold;">3</text>
<rect class="box" x="46" y="175" width="32" height="30"/>
<text class="small" x="62" y="195">^</text>
<text class="small" x="145" y="245">表结点共 e=3；查 3 的入度需扫全表</text>
</g>
<g transform="translate(575, 20)">
<text class="title" x="145" y="22">逆邻接表（存入边，链长＝ID）</text>
<rect class="box-hi" x="10" y="65" width="36" height="30"/><text class="small" x="28" y="85" style="font-weight:bold;">1</text>
<rect class="box" x="46" y="65" width="32" height="30"/>
<line class="edge" x1="62" y1="80" x2="105" y2="80" marker-end="url(#arrow)"/>
<rect class="box-hi" x="108" y="65" width="32" height="30"/><text class="small" x="124" y="85">2</text>
<rect class="box" x="140" y="65" width="26" height="30"/>
<text class="small" x="153" y="85">^</text>
<rect class="box-hi" x="10" y="120" width="36" height="30"/><text class="small" x="28" y="140" style="font-weight:bold;">2</text>
<rect class="box" x="46" y="120" width="32" height="30"/>
<line class="edge" x1="62" y1="135" x2="105" y2="135" marker-end="url(#arrow)"/>
<rect class="box-hi" x="108" y="120" width="32" height="30"/><text class="small" x="124" y="140">1</text>
<rect class="box" x="140" y="120" width="26" height="30"/>
<text class="small" x="153" y="140">^</text>
<rect class="box-hi" x="10" y="175" width="36" height="30"/><text class="small" x="28" y="195" style="font-weight:bold;">3</text>
<rect class="box" x="46" y="175" width="32" height="30"/>
<line class="edge" x1="62" y1="190" x2="105" y2="190" marker-end="url(#arrow)"/>
<rect class="box-hi" x="108" y="175" width="32" height="30"/><text class="small" x="124" y="195">2</text>
<rect class="box" x="140" y="175" width="26" height="30"/>
<text class="small" x="153" y="195">^</text>
<text class="small" x="145" y="245">表结点共 e=3；直接查到 2→3 入边</text>
</g>
</svg>
