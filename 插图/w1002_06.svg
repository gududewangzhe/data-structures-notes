<svg xmlns="http://www.w3.org/2000/svg" width="950" height="530" viewBox="0 0 950 530">
  <defs>
    <marker id="arr-b6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1e6bb8"/>
    </marker>
    <marker id="arr-o6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#d26b19"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; fill: #172b4d; }
    .title { font-size: 20px; font-weight: bold; fill: #091e42; }
    .subtitle { font-size: 15px; fill: #5e6c84; }
    .sub-head { font-size: 16px; font-weight: bold; fill: #091e42; }
    .card { fill: #f4f5f7; stroke: #dfe1e6; stroke-width: 1.2; rx: 6; }
    .step-box { fill: #ffffff; stroke: #c1c7d0; stroke-width: 1; rx: 4; }
    .active-p { fill: #deebff; stroke: #0052cc; stroke-width: 2; rx: 4; }
    .active-pre { fill: #fff0b3; stroke: #ff991f; stroke-width: 2; rx: 4; }
    .code-txt { font-family: monospace; font-size: 13px; fill: #091e42; }
    .comment-txt { font-family: monospace; font-size: 13px; fill: #2e7d32; }
    .legend-text { font-size: 14px; fill: #172b4d; }
  </style>

  <text class="title" x="30" y="38">中序线索化递归执行机制与双指针（pre / p）协同追踪</text>
  <text class="subtitle" x="30" y="66">中序序列推进：E → F → B → A → G → C → D ｜ pre 始终指向刚刚访问完毕的前驱结点</text>

  <!-- 左栏：算法核心逻辑 -->
  <g transform="translate(30, 85)">
    <rect class="card" x="0" y="0" width="410" height="420"/>
    <text class="sub-head" x="20" y="30">访问结点 p 时的核心线索化动作：</text>

    <rect class="step-box" x="15" y="50" width="380" height="85"/>
    <text class="code-txt" x="25" y="75" font-weight="bold">动作一：为当前结点 p 建立前驱线索</text>
    <text class="code-txt" x="25" y="98">if (!p-&gt;lchild) {</text>
    <text class="code-txt" x="45" y="118">    p-&gt;LTag = Thread;  p-&gt;lchild = pre;</text>
    <text class="code-txt" x="25" y="130">}</text>

    <rect class="step-box" x="15" y="145" width="380" height="85"/>
    <text class="code-txt" x="25" y="170" font-weight="bold">动作二：为前驱结点 pre 建立后继线索</text>
    <text class="comment-txt" x="25" y="190">// 当站在 p 时，pre 的后继才水落石出！</text>
    <text class="code-txt" x="25" y="210">if (pre &amp;&amp; !pre-&gt;rchild) {</text>
    <text class="code-txt" x="45" y="225">    pre-&gt;RTag = Thread; pre-&gt;rchild = p;</text>
    <text class="code-txt" x="25" y="235">}</text>

    <rect class="step-box" x="15" y="245" width="380" height="60"/>
    <text class="code-txt" x="25" y="270" font-weight="bold">动作三：推进指针 pre，记录来路</text>
    <text class="code-txt" x="25" y="292">pre = p;  // p 成为下一个访问结点的前驱</text>

    <rect class="step-box" x="15" y="315" width="380" height="85"/>
    <text class="code-txt" x="25" y="338" font-weight="bold">时空错位原理总结：</text>
    <text class="code-txt" x="25" y="360">• p 的左孩子空：直接连向已知的 pre；</text>
    <text class="code-txt" x="25" y="380">• pre 的右孩子空：延后至当前 p 到达时补连；</text>
    <text class="code-txt" x="25" y="400">• pre 与 p 一前一后，完美覆盖相邻前驱后继！</text>
  </g>

  <!-- 右栏：执行跟踪表 -->
  <g transform="translate(460, 85)">
    <rect class="card" x="0" y="0" width="460" height="420"/>
    <text class="sub-head" x="20" y="30">执行过程跟踪表（全树 7 结点演算）：</text>

    <!-- 表头 -->
    <rect x="15" y="45" width="430" height="30" fill="#ebecf0" rx="3"/>
    <text x="25" y="65" font-size="13" font-weight="bold">步骤</text>
    <text x="65" y="65" font-size="13" font-weight="bold">当前 p</text>
    <text x="125" y="65" font-size="13" font-weight="bold">前驱 pre</text>
    <text x="195" y="65" font-size="13" font-weight="bold">生效动作与建立的线索</text>

    <!-- Step 1 -->
    <rect x="15" y="80" width="430" height="35" class="step-box"/>
    <text x="25" y="102" font-size="13">1</text>
    <text x="75" y="102" font-size="13" font-weight="bold" fill="#0052cc">E</text>
    <text x="135" y="102" font-size="13" fill="#ff991f">Thrt</text>
    <text x="195" y="102" font-size="13">E->lchild = Thrt (动作一，首结点)</text>

    <!-- Step 2 -->
    <rect x="15" y="120" width="430" height="35" class="step-box"/>
    <text x="25" y="142" font-size="13">2</text>
    <text x="75" y="142" font-size="13" font-weight="bold" fill="#0052cc">F</text>
    <text x="135" y="142" font-size="13" fill="#ff991f">E</text>
    <text x="195" y="142" font-size="13">F->lchild = E (动作一；E有真右孩F)</text>

    <!-- Step 3 -->
    <rect x="15" y="160" width="430" height="35" class="step-box"/>
    <text x="25" y="182" font-size="13">3</text>
    <text x="75" y="182" font-size="13" font-weight="bold" fill="#0052cc">B</text>
    <text x="135" y="182" font-size="13" fill="#ff991f">F</text>
    <text x="195" y="182" font-size="13">F->rchild = B (动作二！F无右孩)</text>

    <!-- Step 4 -->
    <rect x="15" y="200" width="430" height="35" class="step-box"/>
    <text x="25" y="222" font-size="13">4</text>
    <text x="75" y="222" font-size="13" font-weight="bold" fill="#0052cc">A</text>
    <text x="135" y="222" font-size="13" fill="#ff991f">B</text>
    <text x="195" y="222" font-size="13">B->rchild = A (动作二！B无右孩)</text>

    <!-- Step 5 -->
    <rect x="15" y="240" width="430" height="35" class="step-box"/>
    <text x="25" y="262" font-size="13">5</text>
    <text x="75" y="262" font-size="13" font-weight="bold" fill="#0052cc">G</text>
    <text x="135" y="262" font-size="13" fill="#ff991f">A</text>
    <text x="195" y="262" font-size="13">G->lchild = A (动作一；A有真右孩C)</text>

    <!-- Step 6 -->
    <rect x="15" y="280" width="430" height="35" class="step-box"/>
    <text x="25" y="302" font-size="13">6</text>
    <text x="75" y="302" font-size="13" font-weight="bold" fill="#0052cc">C</text>
    <text x="135" y="302" font-size="13" fill="#ff991f">G</text>
    <text x="195" y="302" font-size="13">G->rchild = C (动作二！G无右孩)</text>

    <!-- Step 7 -->
    <rect x="15" y="320" width="430" height="35" class="step-box"/>
    <text x="25" y="342" font-size="13">7</text>
    <text x="75" y="342" font-size="13" font-weight="bold" fill="#0052cc">D</text>
    <text x="135" y="342" font-size="13" fill="#ff991f">C</text>
    <text x="195" y="342" font-size="13">D->lchild = C (动作一；C有真右孩D)</text>

    <!-- 课后收口 -->
    <rect x="15" y="365" width="430" height="40" fill="#e3fcef" stroke="#36b37e" stroke-width="1.2" rx="3"/>
    <text x="25" y="390" font-size="13" font-weight="bold" fill="#006644">整树递归结束：pre = D，最后执行 pre->rchild = Thrt 完成闭环</text>
  </g>
</svg>